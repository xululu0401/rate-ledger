<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200"><rect width="1200" height="1200" fill="#f4f3ed"/><g font-family="PingFang SC,sans-serif"><text x="85" y="100" fill="#277d77" font-size="24" letter-spacing="4">RATE LEDGER / 分组率分析</text><text x="80" y="238" fill="#173647" font-size="104" font-weight="700">均值拆账<tspan fill="#b86a37">。</tspan></text><text x="85" y="315" fill="#61767e" font-size="36">每组都进步，总率却下降？</text><rect x="80" y="380" width="1040" height="280" rx="24" fill="#173647"/><text x="125" y="446" fill="#c8d9de" font-size="26">虚构演示 / 总成功率</text><text x="125" y="570" fill="#fffefa" font-size="96" font-weight="700">55%</text><text x="480" y="565" fill="#c8d9de" font-size="45">变为</text><text x="725" y="570" fill="#f3be8d" font-size="96" font-weight="700">41%</text><text x="85" y="755" font-size="32" fill="#173647">组内率项</text><text x="790" y="755" font-size="38" fill="#277d77">+12 个百分点</text><rect x="85" y="788" width="1030" height="24" rx="5" fill="#e5eae4"/><rect x="600" y="788" width="237.69230769230757" height="24" fill="#277d77"/><text x="85" y="890" font-size="32" fill="#173647">样本构成项</text><text x="790" y="890" font-size="38" fill="#b86a37">−26 个百分点</text><rect x="85" y="923" width="1030" height="24" rx="5" fill="#e5eae4"/><rect x="85" y="923" width="515" height="24" fill="#b86a37"/><line x1="600" y1="780" x2="600" y2="955" stroke="#718489" stroke-dasharray="4 7"/><text x="600" y="995" text-anchor="middle" fill="#61767e" font-size="23">以零为中心，同尺度展示正负贡献</text><text x="85" y="1090" fill="#173647" font-size="34">对齐分母，再看变化。</text><text x="85" y="1155" fill="#61767e" font-size="23">描述性分解，不证明因果 · 本地计算 / 可导出</text></g></svg>